name: Deploy React/Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 3. Verify replacement frontend exists
      # --------------------------------------------------
      - name: Check replacement frontend
        run: |
          echo "Checking replacement frontend..."

          if [ ! -f "src/main-github-pages-fixed.jsx" ]; then
            echo "ERROR: src/main-github-pages-fixed.jsx not found."
            exit 1
          fi

          LINES=$(wc -l < src/main-github-pages-fixed.jsx)

          echo "Replacement frontend lines: $LINES"

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: Replacement frontend is unexpectedly large."
            exit 1
          fi

          echo "Replacement frontend accepted."

      # --------------------------------------------------
      # 4. Generate package-lock.json
      # --------------------------------------------------
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      # --------------------------------------------------
      # 5. Commit package-lock.json if changed
      # --------------------------------------------------
      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add package-lock.json
            git commit -m "chore: generate package-lock.json"
            git push origin HEAD:main
          fi

      # --------------------------------------------------
      # 6. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 7. FORCE replacement of legacy main.jsx
      # --------------------------------------------------
      - name: Replace legacy main.jsx
        run: |
          echo "Removing legacy src/main.jsx..."

          rm -f src/main.jsx

          echo "Installing GitHub Pages frontend..."

          cp src/main-github-pages-fixed.jsx src/main.jsx

          echo "Active frontend:"
          wc -l src/main.jsx

      # --------------------------------------------------
      # 8. HARD SECURITY CHECK
      # --------------------------------------------------
      - name: Verify active frontend
        run: |
          echo "Verifying active src/main.jsx..."

          if [ ! -f "src/main.jsx" ]; then
            echo "ERROR: src/main.jsx does not exist."
            exit 1
          fi

          LINES=$(wc -l < src/main.jsx)

          echo "Active src/main.jsx lines: $LINES"

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: Legacy/incorrect main.jsx detected."
            echo "BUILD STOPPED."
            exit 1
          fi

          echo "Active frontend verified."

      # --------------------------------------------------
      # 9. Show first lines for debugging
      # --------------------------------------------------
      - name: Show active frontend
        run: |
          echo "----- ACTIVE src/main.jsx -----"
          head -n 10 src/main.jsx
          echo "----- END -----"

      # --------------------------------------------------
      # 10. Validate project data
      # --------------------------------------------------
      - name: Validate data
        run: npm run validate:data

      # --------------------------------------------------
      # 11. Configure GitHub Pages
      # --------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

            # --------------------------------------------------
      # FORCE AND VERIFY FRONTEND
      # --------------------------------------------------
      - name: FORCE correct main.jsx
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FORCING CORRECT FRONTEND"
          echo "========================================"

          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Replacement file:"
          ls -lh src/main-github-pages-fixed.jsx
          wc -l src/main-github-pages-fixed.jsx
          sha256sum src/main-github-pages-fixed.jsx

          echo ""
          echo "Removing old main.jsx..."
          rm -f src/main.jsx

          echo "Copying fixed frontend..."
          cp -f src/main-github-pages-fixed.jsx src/main.jsx

          echo ""
          echo "ACTIVE main.jsx:"
          ls -lh src/main.jsx
          wc -l src/main.jsx
          sha256sum src/main.jsx

          echo ""
          echo "Comparing files..."

          cmp -s src/main-github-pages-fixed.jsx src/main.jsx

          if [ $? -ne 0 ]; then
            echo "ERROR: main.jsx does NOT match fixed frontend."
            exit 1
          fi

          echo ""
          echo "SUCCESS: main.jsx EXACTLY matches fixed frontend."

          LINES=$(wc -l < src/main.jsx)

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: main.jsx has $LINES lines."
            echo "Legacy frontend detected."
            exit 1
          fi

          echo ""
          echo "FINAL CHECK PASSED."
            # --------------------------------------------------
      # VERIFY VITE ENTRY
      # --------------------------------------------------
      - name: Verify Vite entry point
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VITE ENTRY POINT"
          echo "========================================"

          echo "index.html:"
          cat index.html

          echo ""
          echo "src/main.jsx:"
          wc -l src/main.jsx

          echo ""
          echo "First 5 lines:"
          head -n 5 src/main.jsx

          echo ""
          echo "Last 5 lines:"
          tail -n 5 src/main.jsx

          echo ""
          echo "Searching for legacy line range..."

          if grep -n "return" src/main.jsx | head -20; then
            true
          fi

          echo ""
          echo "Entry verification complete."    

      # --------------------------------------------------
      # 12. Build React/Vite
      # --------------------------------------------------
      - name: Build React/Vite
        run: |
          echo "Building ONLY the verified src/main.jsx..."
          npm run build

      # --------------------------------------------------
      # 13. Upload Pages artifact
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ======================================================
  # DEPLOY
  # ======================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
