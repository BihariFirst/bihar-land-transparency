name: Deploy React/Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Node
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 3. HARD CHECK - पुराने main.jsx को रोकें
      # --------------------------------------------------
      - name: Check frontend source
        run: |
          echo "Checking src/main-github-pages-fixed.jsx..."

          if [ ! -f "src/main-github-pages-fixed.jsx" ]; then
            echo "ERROR: src/main-github-pages-fixed.jsx not found."
            exit 1
          fi

          LINES=$(wc -l < src/main-github-pages-fixed.jsx)

          echo "src/main-github-pages-fixed.jsx lines: $LINES"

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: OLD/LEGACY src/main.jsx DETECTED."
            echo "This workflow will NOT build the legacy frontend."
            exit 1
          fi

          echo "Frontend source accepted."

      # --------------------------------------------------
      # 4. package-lock generate
      # --------------------------------------------------
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      # --------------------------------------------------
      # 5. Commit package-lock if required
      # --------------------------------------------------
      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add package-lock.json
            git commit -m "chore: generate package-lock.json"
            git push origin HEAD:main
          fi

      # --------------------------------------------------
      # 6. Clean install
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 7. Final source verification
      # --------------------------------------------------
      - name: Verify source before build
        run: |
          rm -f src/main.jsx
          cp src/main-github-pages-fixed.jsx src/main.jsx

          if grep -n "return" src/main.jsx | tail -20; then
            echo "Return statements found."
          fi

          LINES=$(wc -l < src/main.jsx)

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: Legacy main.jsx detected before build."
            exit 1
          fi

      # --------------------------------------------------
      # 8. Validate data
      # --------------------------------------------------
      - name: Validate data
        run: npm run validate:data

      # --------------------------------------------------
      # 9. GitHub Pages configuration
      # --------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # 10. Build
      # --------------------------------------------------
      - name: Build React/Vite
        run: npm run build

      # --------------------------------------------------
      # 11. Upload
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
