name: Deploy React/Vite to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 3. Verify the ONLY frontend entry file
      # --------------------------------------------------
      - name: Verify src/main.jsx
        run: |
          echo "Checking src/main.jsx..."

          if [ ! -f "src/main.jsx" ]; then
            echo "ERROR: src/main.jsx not found."
            exit 1
          fi

          LINES=$(wc -l < src/main.jsx)

          echo "src/main.jsx lines: $LINES"

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: Legacy/incorrect main.jsx detected."
            echo "Build stopped."
            exit 1
          fi

          echo "Frontend source accepted."

      # --------------------------------------------------
      # 4. Generate package-lock.json
      # --------------------------------------------------
      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund

      # --------------------------------------------------
      # 5. Commit package-lock.json if changed
      # --------------------------------------------------
      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add package-lock.json
            git commit -m "chore: generate package-lock.json"
            git push origin HEAD:main
          fi

      # --------------------------------------------------
      # 6. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 7. Final source verification
      # --------------------------------------------------
      - name: Final source verification
        run: |
          echo "========================================"
          echo "FINAL FRONTEND CHECK"
          echo "========================================"

          echo "File:"
          ls -lh src/main.jsx

          echo ""
          echo "Line count:"
          wc -l src/main.jsx

          echo ""
          echo "SHA256:"
          sha256sum src/main.jsx

          LINES=$(wc -l < src/main.jsx)

          if [ "$LINES" -gt 500 ]; then
            echo "ERROR: Legacy main.jsx detected."
            exit 1
          fi

          echo ""
          echo "Frontend verification PASSED."

      # --------------------------------------------------
      # 8. Validate project data
      # --------------------------------------------------
      - name: Validate data
        run: npm run validate:data

      # --------------------------------------------------
      # 9. Configure GitHub Pages
      # --------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------------
      # 10. Build React/Vite
      # --------------------------------------------------
      - name: Build React/Vite
        run: |
          echo "Building src/main.jsx..."
          npm run build

      # --------------------------------------------------
      # 11. Upload Pages artifact
      # --------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ======================================================
  # DEPLOY
  # ======================================================

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
